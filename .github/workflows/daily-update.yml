name: daily-update

on:
  schedule:
    # 每天北京时间 06:00 / 14:00 / 18:00 自动运行 (UTC 22:00 / 06:00 / 10:00)
    # 一天 3 次: 降低 GitHub schedule 偶发跳过导致的漏跑风险, 有新公告也能更快推送
    - cron: '0 22,6,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/fetch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state.json
          git diff --cached --quiet || git commit -m "chore: daily update $(date -u +'%Y-%m-%d %H:%M')"
          git push
