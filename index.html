<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专家库动态 · 实时追踪</title>
<style>
  :root { --bg:#f7f7f5; --card:#ffffff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#185fa5; --chip:#e6f1fb; --tag:#0c447c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; }
  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 16px 10px; z-index: 10; }
  h1 { font-size: 18px; font-weight: 600; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .toolbar { display: flex; gap: 8px; padding: 12px 16px 0; }
  select, input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 14px; background: var(--card); color: var(--text); -webkit-appearance: none; appearance: none; }
  .list { padding: 12px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card a { color: var(--text); text-decoration: none; font-size: 15px; line-height: 1.5; display: block; }
  .card a:hover { color: var(--accent); }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .chip { background: var(--chip); color: var(--tag); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .deadline { color: #a32d2d; font-weight: 500; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }
  .count { font-size: 12px; color: var(--muted); padding: 4px 16px 0; }
</style>
</head>
<body>
<header>
  <h1>专家库动态 · 实时追踪</h1>
  <div class="meta" id="meta">加载中…</div>
</header>
<div class="toolbar">
  <select id="province"><option value="">全部省份</option></select>
  <input id="search" type="search" placeholder="搜索关键词…">
</div>
<div class="count" id="count"></div>
<div class="list" id="list"><div class="empty">加载中…</div></div>

<script>
// 内置示例数据: 当 data.json 无法加载(如本地直接打开文件)时兜底展示
var FALLBACK = {
  updated_at: "示例数据（部署后自动更新）",
  records: [
    { id: "demo1", date: "2026-08-25", province: "湖北", title: "湖北省综合评标专家库公开征集入库专家公告", source: "示例来源", link: "#", deadline: "2026-09-15" },
    { id: "demo2", date: "2026-08-25", province: "广东", title: "广东省科技专家库申报工作启动", source: "示例来源", link: "#", deadline: "" }
  ]
};

function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function daysLeft(deadline) {
  if (!deadline) return "";
  var diff = Math.ceil((new Date(deadline) - new Date(today())) / 86400000);
  if (diff < 0) return "已截止";
  if (diff === 0) return "今日截止";
  return "剩 " + diff + " 天";
}

var state = { data: null, province: "", keyword: "" };

function render() {
  var data = state.data;
  if (!data || !data.records) { document.getElementById("list").innerHTML = '<div class="empty">暂无数据</div>'; return; }
  document.getElementById("meta").textContent = "更新于 " + (data.updated_at || "-") + " · 数据为公开公告信息，以官方发布为准";
  var list = data.records.filter(function (r) {
    if (state.province && r.province !== state.province) return false;
    if (state.keyword && r.title.indexOf(state.keyword) < 0) return false;
    return true;
  });
  document.getElementById("count").textContent = "共 " + list.length + " 条";
  if (!list.length) { document.getElementById("list").innerHTML = '<div class="empty">没有符合条件的记录</div>'; return; }
  var html = "";
  list.forEach(function (r) {
    var dl = daysLeft(r.deadline);
    var chip = dl ? '<span class="deadline">' + dl + '</span>' : '<span class="chip">开放中</span>';
    html += '<div class="card"><a href="' + r.link + '" target="_blank" rel="noopener">' + r.title + '</a>' +
      '<div class="row"><span class="chip">' + (r.province || "未分类") + '</span>' + chip +
      '<span>' + (r.source || "") + '</span><span>' + (r.date || "") + '</span></div></div>';
  });
  document.getElementById("list").innerHTML = html;
}

function fillProvinces() {
  var sel = document.getElementById("province");
  var seen = {};
  (state.data && state.data.records || []).forEach(function (r) { if (r.province) seen[r.province] = 1; });
  Object.keys(seen).sort().forEach(function (p) {
    var o = document.createElement("option");
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
}

document.getElementById("province").addEventListener("change", function (e) { state.province = e.target.value; render(); });
document.getElementById("search").addEventListener("input", function (e) { state.keyword = e.target.value.trim(); render(); });

fetch("data.json").then(function (res) {
  if (!res.ok) throw new Error("no data.json");
  return res.json();
}).then(function (data) {
  state.data = data; fillProvinces(); render();
}).catch(function () {
  state.data = FALLBACK; fillProvinces(); render();
});
</script>
</body>
</html>
